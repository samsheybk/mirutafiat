<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Intranet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .home-area { display: flex; align-items: center; justify-content: center; }
    .home-welcome { max-width: 760px; text-align: center; padding: 40px 24px; }
    .home-hello { font-size: clamp(28px, 5vw, 44px); font-weight: 800; letter-spacing: -1px; color: var(--color-text); }
    .home-hello strong { color: #0d9488; }
    .home-sub { margin-top: 10px; color: var(--color-text-secondary); font-size: 15px; }
    .home-carousel { margin-top: 48px; min-height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .home-phrase { font-size: clamp(20px, 3.2vw, 30px); line-height: 1.45; font-weight: 600; color: #334155; max-width: 640px; opacity: 0; transform: translateY(10px); transition: opacity 0.5s ease, transform 0.5s ease; }
    .home-phrase.show { opacity: 1; transform: translateY(0); }
    .home-dots { margin-top: 28px; display: flex; gap: 8px; }
    .home-dot { width: 9px; height: 9px; border-radius: 50%; border: none; padding: 0; cursor: pointer; background: var(--color-border); transition: background 0.3s ease, transform 0.3s ease; }
    .home-dot.active { background: #0d9488; transform: scale(1.35); }
    .home-hint { margin-top: 44px; font-size: 13px; color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <div class="app-layout">
    <nav class="topnav">
      <div class="topnav-brand" onclick="location.href='dashboard.html'"><span class="topnav-logo"></span>Intranet</div>
      <select class="nav-select" id="navSelect" onchange="navigateModule(this.value)">
        <option value="dashboard.html">Home</option>
        <option value="modules/captacion.html">Captación y Selección</option>
        <option value="modules/relaciones-laborales.html">Relaciones Laborales</option>
        <option value="modules/capacitacion.html">Capacitación y Desarrollo</option>
        <option value="modules/bienestar-social.html">Bienestar Social</option>
        <option value="modules/seguridad-salud.html">Seguridad y Salud Laboral</option>
        <option value="modules/compensacion.html">Compensación</option>
        <option value="modules/finanzas.html">Finanzas</option>
        <option value="modules/repositorio.html">Repositorio</option>
        <option value="modules/chatfiat.html">Mensajería</option>
        <option value="modules/desarrollo-organizacional.html">Desarrollo organizacional</option>
      </select>

      <div class="topnav-spacer"></div>
      <div class="nav-user">
        <div class="nav-user-menu">
          <button class="nav-user-menu-btn" id="userMenuBtn" type="button" aria-label="Opciones de usuario" title="Opciones de usuario">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="12" cy="19" r="1.9"></circle></svg>
          </button>
          <div class="nav-user-dropdown" id="userDropdown">
            <div class="user-drop-header">
              <div class="user-drop-name" id="userDropName">Usuario</div>
              <div class="user-drop-email" id="userDropEmail"></div>
              <div class="user-drop-meta" id="userDropMeta"></div>
            </div>
            <button type="button" class="user-drop-item" id="userDropHelp">Detalles del módulo</button>
            <button type="button" class="user-drop-item user-drop-danger" id="userDropLogout">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </nav>

    <div class="main-content">
      <header class="topbar">
        <div>
          <h1>Home</h1>
          <div class="topbar-breadcrumb">Inicio / Home</div>
        </div>
      </header>

      <div class="content-area home-area">
        <div class="home-welcome">
          <div class="home-hello">¡Hola, <strong id="homeName">bienvenido</strong>!</div>
          <div class="home-sub">Nos alegra verte de nuevo en la intranet FIAT</div>
          <div class="home-carousel">
            <div class="home-phrase" id="homePhrase"></div>
            <div class="home-dots" id="homeDots"></div>
          </div>
          <div class="home-hint">Usa el menú superior para navegar por los módulos</div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/module-help.js"></script>
  <script src="js/access.js"></script>
</body>
</html>
