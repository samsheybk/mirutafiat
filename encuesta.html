<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta - FIAT Venezuela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }
    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header img {
      max-width: 92px;
      height: auto;
      margin-bottom: 12px;
      filter: brightness(0);
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header p {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #d1d5db;
      padding: 24px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .card .desc {
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }
    .card .dates {
      font-size: 11px;
      color: #888;
      margin-top: 10px;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      color: #444;
    }
    .form-group label .required { color: #db2777; }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      background: #fff;
      color: #1a1a1a;
      font-size: 14px;
      font-family: inherit;
      border-radius: 4px;
    }
    .form-input:focus { outline: none; border-color: #db2777; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .question { margin-bottom: 18px; }
    .question .q-text {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .question .q-text .q-num {
      display: inline-block;
      min-width: 22px;
      height: 22px;
      line-height: 22px;
      text-align: center;
      background: #db2777;
      color: #fff;
      font-size: 11px;
      border-radius: 4px;
      margin-right: 8px;
      font-weight: 700;
    }
    .opcion {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .opcion:hover { border-color: #db2777; background: #fff5f9; }
    .opcion input[type="radio"] { accent-color: #db2777; width: 16px; height: 16px; flex-shrink: 0; }
    .opcion label { font-size: 13px; cursor: pointer; flex: 1; }
    .btn-submit {
      width: 100%;
      padding: 12px 24px;
      background: #db2777;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn-submit:hover { opacity: .9; }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }
    .error-message {
      display: none;
      background: #fee2e2;
      color: #b91c1c;
      padding: 10px 14px;
      font-size: 12px;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .success-box {
      display: none;
      text-align: center;
      padding: 48px 24px;
    }
    .success-box .check {
      width: 56px;
      height: 56px;
      background: #db2777;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 26px;
      border-radius: 50%;
    }
    .success-box h3 { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
    .success-box p { font-size: 13px; line-height: 1.6; color: #555; }
    .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #888; }
    .footer a { color: #666; text-decoration: none; border-bottom: 1px solid currentColor; }
    .footer a:hover { color: #db2777; }
    .skeleton {
      position: relative;
      overflow: hidden;
      height: 14px;
      background: #e5e7eb;
      border-radius: 4px;
    }
    .skeleton::after {
      content: '';
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 100% { transform: translateX(100%); } }
    .skeleton-block { height: 18px; }
    @media (max-width: 480px) {
      .form-row { grid-template-columns: 1fr; }
      .header h1 { font-size: 19px; }
      .card { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <img src="icons/logo FIAT.webp" alt="FIAT Venezuela">
      <h1>Encuesta de Bienestar</h1>
      <p>Tu opinión es importante para mejorar el clima laboral</p>
    </div>

    <div id="estadoCargando">
      <div class="card">
        <div class="skeleton skeleton-block" style="width:40%"></div>
        <div class="skeleton" style="width:90%;margin-top:12px;"></div>
        <div class="skeleton" style="width:65%;margin-top:10px;"></div>
      </div>
      <div class="card">
        <div class="skeleton skeleton-block" style="width:30%"></div>
        <div class="skeleton" style="width:85%;margin-top:12px;"></div>
        <div class="skeleton" style="width:50%;margin-top:10px;"></div>
      </div>
    </div>

    <div id="errorContainer" class="card" style="display:none;text-align:center;padding:48px 24px;">
      <h2 style="color:#b91c1c;margin-bottom:10px;">Encuesta no disponible</h2>
      <p style="font-size:13px;color:#555;" id="errorMsg">Esta encuesta no existe o ya no está activa.</p>
    </div>

    <div id="formContainer" style="display:none;">
      <div class="card" id="infoCard"></div>
      <div class="card" id="identityCard"></div>
      <div class="card" id="questionsCard"></div>
      <div class="error-message" id="submitError"></div>
      <button class="btn-submit" id="submitBtn" onclick="enviarRespuestas()">Enviar respuestas</button>
    </div>

    <div class="success-box" id="successContainer">
      <div class="check">✓</div>
      <h3>¡Respuestas enviadas!</h3>
      <p>Gracias por participar. Tus respuestas fueron registradas correctamente.</p>
    </div>

    <div class="footer">
      <a href="index.html">Acceso empleados</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fechaLegible(f) {
      if (!f) return '';
      var d = new Date(f);
      return isNaN(d.getTime()) ? f : d.toLocaleDateString('es-VE', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    var encuestaId = new URLSearchParams(location.search).get('id');
    var preguntas = [];
    var encuesta = null;

    async function cargarEncuesta() {
      if (!encuestaId) {
        mostrarError('Falta el identificador de la encuesta en el enlace.');
        return;
      }
      try {
        var re = await supabaseClient
          .from('bienestar_encuestas')
          .select('*')
          .eq('id', encuestaId)
          .maybeSingle();
        if (re.error) throw re.error;
        encuesta = re.data;
        if (!encuesta || encuesta.estado !== 'Activa') {
          mostrarError('Esta encuesta no existe o ya no está activa.');
          return;
        }

        var rp = await supabaseClient
          .from('bienestar_encuesta_preguntas')
          .select('*')
          .eq('encuesta_id', encuestaId)
          .order('orden');
        if (rp.error) throw rp.error;
        preguntas = (rp.data || []).filter(function(p) {
          return (p.opciones && p.opciones.length >= 2);
        });
        if (!preguntas.length) {
          mostrarError('Esta encuesta aún no tiene preguntas.');
          return;
        }

        renderInfo();
        renderFormulario();
        document.getElementById('estadoCargando').style.display = 'none';
        document.getElementById('formContainer').style.display = 'block';
      } catch (err) {
        mostrarError('Error al cargar la encuesta: ' + err.message);
      }
    }

    function mostrarError(msg) {
      document.getElementById('estadoCargando').style.display = 'none';
      document.getElementById('errorContainer').style.display = 'block';
      document.getElementById('errorMsg').textContent = msg;
    }

    function renderInfo() {
      var fechas = [];
      if (encuesta.fecha_inicio || encuesta.fecha_fin) {
        fechas.push('Del ' + fechaLegible(encuesta.fecha_inicio));
        if (encuesta.fecha_fin) fechas.push('al ' + fechaLegible(encuesta.fecha_fin));
      }
      var html = '<h2>' + esc(encuesta.titulo) + '</h2>';
      if (encuesta.descripcion) html += '<p class="desc">' + esc(encuesta.descripcion) + '</p>';
      if (fechas.length) html += '<p class="dates">' + fechas.join(' ') + '</p>';
      document.getElementById('infoCard').innerHTML = html;
    }

    function renderFormulario() {
      document.getElementById('identityCard').innerHTML =
        '<div class="form-row">' +
          '<div class="form-group"><label>Cédula <span class="required">*</span></label>' +
            '<input type="text" class="form-input" id="cedula" placeholder="V12345678" maxlength="12" oninput="this.value=this.value.toUpperCase()"></div>' +
          '<div class="form-group"><label>Nombre completo</label>' +
            '<input type="text" class="form-input" id="nombre" placeholder="Opcional"></div>' +
        '</div>';

      var html = '';
      preguntas.forEach(function(p, i) {
        html += '<div class="question">' +
          '<div class="q-text"><span class="q-num">' + (i + 1) + '</span>' + esc(p.pregunta) + '</div>';
        p.opciones.forEach(function(op, j) {
          html += '<div class="opcion">' +
            '<input type="radio" name="q_' + p.id + '" id="q_' + p.id + '_' + j + '" value="' + esc(op) + '">' +
            '<label for="q_' + p.id + '_' + j + '">' + esc(op) + '</label>' +
            '</div>';
        });
        html += '</div>';
      });
      document.getElementById('questionsCard').innerHTML = html;
    }

    function mostrarErrorEnvio(msg) {
      var el = document.getElementById('submitError');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function enviarRespuestas() {
      var cedula = document.getElementById('cedula').value.trim();
      if (!cedula) {
        mostrarErrorEnvio('Debes escribir tu cédula.');
        return;
      }
      var nombre = document.getElementById('nombre').value.trim() || null;

      var respuestas = [];
      for (var i = 0; i < preguntas.length; i++) {
        var sel = document.querySelector('input[name="q_' + preguntas[i].id + '"]:checked');
        if (!sel) {
          mostrarErrorEnvio('Debes responder todas las preguntas (falta la pregunta ' + (i + 1) + ').');
          return;
        }
        respuestas.push({
          encuesta_id: encuestaId,
          pregunta_id: preguntas[i].id,
          cedula: cedula,
          nombre: nombre,
          opcion: sel.value
        });
      }

      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Enviando...';
      document.getElementById('submitError').style.display = 'none';

      try {
        var { error } = await supabaseClient
          .from('bienestar_encuesta_respuestas')
          .insert(respuestas);
        if (error) {
          if (String(error.code) === '23505') {
            throw new Error('Ya registraste tus respuestas para esta encuesta.');
          }
          throw error;
        }
        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('successContainer').style.display = 'block';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Enviar respuestas';
        mostrarErrorEnvio('Error al enviar: ' + err.message);
      }
    }

    cargarEncuesta();
  </script>
</body>
</html>
