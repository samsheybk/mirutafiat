<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIAT Venezuela - Intranet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-logo">
      <img src="icons/logo FIAT.webp" alt="FIAT Venezuela" style="max-width:200px;height:auto;">
    </div>
    <div class="login-error" id="loginError"></div>
    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" class="form-input" placeholder="usuario@fiat.com.ve" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-block" id="loginBtn">Iniciar sesión</button>
      <p style="text-align:center;margin-top:16px;font-size:13px;color:#666;">
        ¿Buscas empleo? <a href="postulacion/" style="color:#2563eb;text-decoration:none;font-weight:500;">Postúlate aquí</a>
      </p>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
