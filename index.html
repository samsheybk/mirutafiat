<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intranet</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="login-page">
    <canvas id="loginWaves"></canvas>
    <div class="login-logo">
      <div class="login-circle"></div>
      <div style="margin-top:10px;font-size:14px;font-weight:700;letter-spacing:3px;color:var(--color-text);">LA SINAPSIS CORRECTA</div>
    </div>
    <form id="loginForm" class="login-form">
      <div class="login-error" id="loginError"></div>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" class="form-input" placeholder="usuario@correo.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="password-toggle" id="passwordToggle" onclick="togglePassword()" aria-label="Ver contraseña">
            <svg id="eyeIconOpen" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeIconClosed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-block" id="loginBtn">Iniciar sesión</button>
      <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--color-text-secondary);">
        ¿Buscas empleo? <a href="postulacion/" style="color:#2563eb;text-decoration:none;font-weight:500;">Postúlate aquí</a>
      </p>
    </form>
    <footer style="position:fixed;bottom:0;left:0;right:0;text-align:center;padding:16px;font-size:12px;color:var(--color-text-secondary);">
      Un proyecto impulsado por el Departamento de Talento Humano
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/access.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    function togglePassword() {
      var input = document.getElementById('password');
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      document.getElementById('eyeIconOpen').style.display = show ? 'none' : '';
      document.getElementById('eyeIconClosed').style.display = show ? '' : 'none';
    }

    (function() {
      var canvas = document.getElementById('loginWaves');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      var W = 0, H = 0;
      var nodes = [];
      var pulses = [];
      var LINK = 135;
      var COLORS = ['37, 99, 235', '99, 102, 241', '168, 85, 247', '6, 182, 212'];

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function node(x, y) {
        return {
          x: x == null ? Math.random() * W : x,
          y: y == null ? Math.random() * H : y,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          r: 1.6 + Math.random() * 1.8
        };
      }

      function seed() {
        var n = Math.max(26, Math.round((W * H) / 26000));
        for (var i = 0; i < n; i++) nodes.push(node());
      }

      function grow() {
        if (nodes.length > 150 || !nodes.length) return;
        var src = nodes[Math.floor(Math.random() * nodes.length)];
        var a = Math.random() * Math.PI * 2;
        var d = LINK * (0.5 + Math.random() * 0.5);
        var x = Math.max(8, Math.min(W - 8, src.x + Math.cos(a) * d));
        var y = Math.max(8, Math.min(H - 8, src.y + Math.sin(a) * d));
        nodes.push(node(x, y));
        pulses.push({
          sx: src.x, sy: src.y, tx: x, ty: y,
          p: 0, s: 0.012,
          c: COLORS[Math.floor(Math.random() * COLORS.length)]
        });
      }

      function frame() {
        ctx.clearRect(0, 0, W, H);

        for (var i = 0; i < nodes.length; i++) {
          var a = nodes[i];
          for (var j = i + 1; j < nodes.length; j++) {
            var b = nodes[j];
            var dx = b.x - a.x, dy = b.y - a.y;
            var d2 = dx * dx + dy * dy;
            if (d2 < LINK * LINK) {
              ctx.strokeStyle = 'rgba(99, 102, 241,' + (0.22 * (1 - Math.sqrt(d2) / LINK)) + ')';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }

        for (var k = pulses.length - 1; k >= 0; k--) {
          var pu = pulses[k];
          pu.p += pu.s;
          if (pu.p >= 1) { pulses.splice(k, 1); continue; }
          var px = pu.sx + (pu.tx - pu.sx) * pu.p;
          var py = pu.sy + (pu.ty - pu.sy) * pu.p;
          ctx.strokeStyle = 'rgba(' + pu.c + ',0.55)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(pu.sx, pu.sy);
          ctx.lineTo(px, py);
          ctx.stroke();
          var glow = 3 + pu.p * 9;
          var g = ctx.createRadialGradient(px, py, 0, px, py, glow);
          g.addColorStop(0, 'rgba(' + pu.c + ',0.9)');
          g.addColorStop(1, 'rgba(' + pu.c + ',0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(px, py, glow, 0, Math.PI * 2);
          ctx.fill();
        }

        for (var m = 0; m < nodes.length; m++) {
          var n = nodes[m];
          n.x += n.vx; n.y += n.vy;
          if (n.x < 0 || n.x > W) n.vx *= -1;
          if (n.y < 0 || n.y > H) n.vy *= -1;
          n.x = Math.max(0, Math.min(W, n.x));
          n.y = Math.max(0, Math.min(H, n.y));
          ctx.fillStyle = 'rgba(59, 130, 246, 0.9)';
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fill();
        }

        window.requestAnimationFrame(frame);
      }

      window.addEventListener('resize', resize);
      resize();
      seed();
      setInterval(grow, 1400);
      window.requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
