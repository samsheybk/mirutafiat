<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil - FIAT Intranet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/uicons-solid-rounded.css">
  <style>
    :root { --module-color: var(--module-desarrollo); }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 22px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .profile-avatar {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0d9488, #0ea5e9);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .profile-title h1 { margin: 0 0 4px; font-size: 20px; }
    .profile-title .profile-sub { font-size: 13px; color: var(--color-text-secondary); }
    .profile-badges { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .profile-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 18px;
    }
    .profile-card h3 { margin: 0 0 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .profile-card h3 i.fi { color: #0d9488; }
    .profile-field {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px solid var(--color-border);
      font-size: 13px;
    }
    .profile-field:last-child { border-bottom: none; }
    .profile-field .p-label { color: var(--color-text-secondary); display: flex; align-items: center; gap: 6px; }
    .profile-field .p-label i.fi { color: #0d9488; }
    .profile-field .p-value { font-weight: 600; text-align: right; }
    .chip {
      display: inline-block;
      padding: 4px 10px;
      margin: 2px;
      font-size: 12px;
      border-radius: 20px;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      color: var(--color-text);
    }
    .chip-info { background: rgba(13,148,136,.10); border-color: rgba(13,148,136,.35); color: #0d9488; font-weight: 600; }
    .empty-hint {
      padding: 18px;
      text-align: center;
      color: var(--color-text-secondary);
      font-size: 13px;
      background: var(--color-surface);
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-sm);
    }
    .pass-msg { display: none; margin-top: 12px; font-size: 13px; }
    .pass-msg.show { display: block; }
    .pass-msg.ok { color: #0d9488; }
    .pass-msg.err { color: #dc2626; }
    @media (max-width: 640px) {
      .profile-field { flex-direction: column; gap: 2px; }
      .profile-field .p-value { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <nav class="topnav" style="background:var(--module-desarrollo);">
      <div class="topnav-brand" onclick="location.href='dashboard.html'"><img class="topnav-logo" src="icons/logo FIAT.webp" alt="FIAT">VEN<span>-Intranet</span></div>
      <div class="topnav-spacer"></div>
      <select class="nav-select" id="navSelect" onchange="navigateModule(this.value)">
        <option value="dashboard.html">Dashboard</option>
        <option value="modules/captacion.html">Captación y Selección</option>
        <option value="modules/relaciones-laborales.html">Relaciones Laborales</option>
        <option value="modules/capacitacion.html">Capacitación y Desarrollo</option>
        <option value="modules/bienestar-social.html">Bienestar Social</option>
        <option value="modules/seguridad-salud.html">Seguridad y Salud Laboral</option>
        <option value="modules/compensacion.html">Compensación</option>
        <option value="modules/finanzas.html">Finanzas</option>
        <option value="modules/repositorio.html">Repositorio</option>
        <option value="modules/chatfiat.html">ChatFIAT</option>
        <option value="modules/desarrollo-organizacional.html">Desarrollo organizacional</option>
      </select>
      <div class="nav-user">
        <span id="navUserEmail"></span>
        <button class="btn-nav-logout" id="logoutBtn">Cerrar sesión</button>
      </div>
    </nav>

    <div class="main-content">
      <header class="topbar">
        <div>
          <h1>Mi perfil</h1>
          <div class="topbar-breadcrumb">Inicio / Mi perfil</div>
        </div>
      </header>

      <div class="content-area">
        <div class="profile-header" id="profileHeader">
          <div class="profile-avatar" id="profileAvatar">—</div>
          <div class="profile-title">
            <h1 id="profileName">Cargando...</h1>
            <div class="profile-sub" id="profileSub">Obteniendo tu información</div>
            <div class="profile-badges" id="profileBadges"></div>
          </div>
        </div>

        <div class="profile-grid">
          <div class="profile-card">
            <h3><i class="fi fi-sr-id-badge"></i>Información personal</h3>
            <div id="profileInfo"><div class="empty-hint">Cargando...</div></div>
            <button type="button" class="btn btn-desarrollo" id="openPassBtn" style="margin-top:14px;"><i class="fi fi-sr-lock"></i>Cambiar contraseña</button>
          </div>
          <div class="profile-card">
            <h3><i class="fi fi-sr-laptop"></i>Acceso a la intranet</h3>
            <div id="profileAccess"><div class="empty-hint">Cargando...</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="passModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Cambiar contraseña</h3>
        <button type="button" class="modal-close" id="passClose" aria-label="Cerrar">&times;</button>
      </div>
      <div class="modal-body">
        <form id="passForm">
          <div class="form-group" style="margin-bottom:14px;">
            <label for="passCurrent">Contraseña actual</label>
            <input type="password" class="form-input" id="passCurrent" autocomplete="current-password">
          </div>
          <div class="form-group" style="margin-bottom:14px;">
            <label for="passNew">Nueva contraseña</label>
            <input type="password" class="form-input" id="passNew" autocomplete="new-password">
          </div>
          <div class="form-group" style="margin-bottom:14px;">
            <label for="passConfirm">Confirmar nueva contraseña</label>
            <input type="password" class="form-input" id="passConfirm" autocomplete="new-password">
          </div>
          <div class="pass-msg" id="passMsg"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" id="passCancel">Cancelar</button>
        <button type="submit" form="passForm" class="btn btn-desarrollo" id="passBtn">Actualizar contraseña</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/module-help.js"></script>
  <script src="js/access.js"></script>
  <script>
    (function () {
      'use strict';

      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function waitAccess() {
        return new Promise(function (resolve) {
          var tries = 0;
          var t = setInterval(function () {
            var st = window.fiatAccess && window.fiatAccess.state;
            if (st && (st.ready === true || st.allow === false)) {
              clearInterval(t);
              resolve(st);
            } else if (++tries > 80) {
              clearInterval(t);
              resolve(st || { allow: false });
            }
          }, 100);
        });
      }

      function field(label, value, icon) {
        return '<div class="profile-field"><span class="p-label">' + (icon ? '<i class="fi ' + icon + '"></i>' : '') + label + '</span><span class="p-value">' + esc(value === null || value === undefined ? '—' : value) + '</span></div>';
      }

      function initialsOf(nombres, apellidos, fallback) {
        var a = (nombres || '').trim().charAt(0) || '';
        var b = (apellidos || '').trim().charAt(0) || '';
        return (a + b).toUpperCase() || fallback;
      }

      function modulosDe(st) {
        if (st.isAdmin) return [{ name: 'Acceso total', detail: 'Usuario administrador' }];
        if (!st.hasRow || !st.modulos) return [{ name: 'Todos los módulos', detail: 'Configuración inicial: sin fila en usuario_accesos' }];
        var lista = window.FIAT_MODULES || [];
        var res = [];
        Object.keys(st.modulos).forEach(function (key) {
          var mod = null;
          for (var i = 0; i < lista.length; i++) { if (lista[i].key === key) { mod = lista[i]; break; } }
          if (!mod) return;
          var tools = st.modulos[key];
          var detail = '';
          if (Array.isArray(tools) && tools.indexOf('*') !== -1) {
            detail = 'Todas las herramientas';
          } else if (Array.isArray(tools) && tools.length) {
            var nombres = tools.map(function (tk) {
              for (var j = 0; j < mod.tools.length; j++) { if (mod.tools[j].key === tk) return mod.tools[j].name; }
              return tk;
            });
            detail = 'Herramientas: ' + nombres.join(', ');
          }
          res.push({ name: mod.name, detail: detail });
        });
        return res.length ? res : [{ name: 'Sin módulos asignados', detail: 'Contacta al administrador' }];
      }

      document.addEventListener('DOMContentLoaded', async function () {
        var st = await waitAccess();
        if (!st || !st.allow) return;

        var userRes = await supabaseClient.auth.getUser().catch(function () { return { data: { user: null } }; });
        var email = (userRes.data && userRes.data.user && userRes.data.user.email) || '';
        var worker = st.worker;

        var cargos = [];
        var unidades = [];
        if (worker) {
          async function fetchList(tabla, cols) {
            try {
              var r = await supabaseClient.from(tabla).select(cols);
              return (r && r.data) || [];
            } catch (e) { return []; }
          }
          var datos = await Promise.all([
            fetchList('est_cargos', 'id, titulo'),
            fetchList('est_unidades', 'id, nombre')
          ]);
          cargos = datos[0];
          unidades = datos[1];
        }

        var cargo = null;
        var unidad = null;
        if (worker) {
          for (var i = 0; i < cargos.length; i++) { if (cargos[i].id === worker.cargo_id) { cargo = cargos[i].titulo; break; } }
          for (var j = 0; j < unidades.length; j++) { if (unidades[j].id === worker.unidad_id) { unidad = unidades[j].nombre; break; } }
        }

        var nombre = worker ? ((worker.nombres || '') + ' ' + (worker.apellidos || '')).trim() : email;
        var sub = worker ? ([cargo, unidad].filter(Boolean).join(' · ') || 'FIAT Venezuela') : 'Cuenta maestra de administración';
        document.getElementById('profileName').textContent = nombre || '—';
        document.getElementById('profileSub').textContent = sub;
        document.getElementById('profileAvatar').textContent = initialsOf(worker ? worker.nombres : email, worker ? worker.apellidos : '', 'A');

        var badges = '';
        if (worker) {
          badges += '<span class="badge badge-active">' + esc(worker.estado) + '</span>';
        }
        badges += '<span class="badge badge-pending">' + esc(st.role || 'Empleado') + '</span>';
        document.getElementById('profileBadges').innerHTML = badges;

        var info = '';
        if (worker) {
          info = field('Cédula', worker.cedula, 'fi-sr-id-card') +
            field('Código de nómina', worker.codigo_nomina, 'fi-sr-credit-card') +
            field('Correo', worker.correo, 'fi-sr-envelope') +
            field('Teléfono', worker.telefono, 'fi-sr-phone-call') +
            field('Fecha de ingreso', worker.fecha_ingreso, 'fi-sr-calendar') +
            field('Unidad', unidad, 'fi-sr-building') +
            field('Cargo', cargo, 'fi-sr-briefcase') +
            (worker.direccion ? field('Dirección', worker.direccion, 'fi-sr-location-dot') : '');
        } else {
          info = field('Correo', email, 'fi-sr-envelope') +
            '<div style="padding-top:8px;font-size:13px;color:var(--color-text-secondary);">Cuenta maestra del administrador. No está vinculada a una ficha de la plantilla de trabajadores.</div>';
        }
        document.getElementById('profileInfo').innerHTML = info;

        var mods = modulosDe(st);
        var access = field('Rol', st.role || 'Empleado', 'fi-sr-user') +
          field('Estado del acceso', st.isAdmin ? 'Usuario maestro' : st.hasRow ? 'Activo' : 'Activo (configuración inicial)', 'fi-sr-shield-check') +
          '<div style="padding-top:10px;">' +
          '<div class="p-label" style="color:var(--color-text-secondary);font-size:13px;margin-bottom:6px;"><i class="fi fi-sr-laptop"></i> Módulos disponibles</div>' +
          '<div>' + mods.map(function (m) { return '<span class="chip chip-info" title="' + esc(m.detail) + '">' + esc(m.name) + '</span>'; }).join('') + '</div>' +
          '</div>';
        document.getElementById('profileAccess').innerHTML = access;

        var passForm = document.getElementById('passForm');
        var passModal = document.getElementById('passModal');
        var openPassBtn = document.getElementById('openPassBtn');
        var closePassBtn = document.getElementById('passClose');
        var cancelPassBtn = document.getElementById('passCancel');

        function openPassModal() {
          passForm.reset();
          document.getElementById('passMsg').className = 'pass-msg';
          document.getElementById('passBtn').disabled = false;
          document.getElementById('passBtn').textContent = 'Actualizar contraseña';
          passModal.classList.add('show');
          document.getElementById('passCurrent').focus();
        }
        function closePassModal() { passModal.classList.remove('show'); }

        if (passForm && passModal && openPassBtn) {
          openPassBtn.addEventListener('click', openPassModal);
          closePassBtn.addEventListener('click', closePassModal);
          cancelPassBtn.addEventListener('click', closePassModal);
          passModal.addEventListener('click', function (e) { if (e.target === passModal) closePassModal(); });
          document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && passModal.classList.contains('show')) closePassModal(); });

          passForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            var msgEl = document.getElementById('passMsg');
            var btn = document.getElementById('passBtn');
            msgEl.className = 'pass-msg';

            var current = document.getElementById('passCurrent').value;
            var next = document.getElementById('passNew').value;
            var confirm = document.getElementById('passConfirm').value;

            function showPassMsg(text, type) { msgEl.textContent = text; msgEl.className = 'pass-msg show ' + type; }

            if (!current || !next || !confirm) { showPassMsg('Completa todos los campos.', 'err'); return; }
            if (next.length < 6) { showPassMsg('La nueva contraseña debe tener al menos 6 caracteres.', 'err'); return; }
            if (next !== confirm) { showPassMsg('Las contraseñas no coinciden.', 'err'); return; }
            if (next === current) { showPassMsg('La nueva contraseña debe ser diferente a la actual.', 'err'); return; }

            btn.disabled = true;
            btn.textContent = 'Actualizando...';
            try {
              var check = await supabaseClient.auth.signInWithPassword({ email: email, password: current });
              if (check.error) {
                showPassMsg('La contraseña actual es incorrecta.', 'err');
                btn.disabled = false; btn.textContent = 'Actualizar contraseña'; return;
              }
              var upd = await supabaseClient.auth.updateUser({ password: next });
              if (upd.error) throw upd.error;
              showPassMsg('Contraseña actualizada correctamente. Serás redirigido para iniciar sesión.', 'ok');
              setTimeout(function () {
                supabaseClient.auth.signOut().then(function () {
                  window.location.href = 'index.html?msg=passok';
                });
              }, 1500);
            } catch (err) {
              showPassMsg('No se pudo actualizar la contraseña. Intenta de nuevo.', 'err');
              btn.disabled = false; btn.textContent = 'Actualizar contraseña';
            }
          });
        }
      });
    })();
  </script>
</body>
</html>
