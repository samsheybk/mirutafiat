<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reloj biométrico - FIAT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: radial-gradient(1200px 800px at 50% -10%, #17324d 0%, #0b1a2b 55%, #07111d 100%);
      color: #fff;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .reloj-home {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: 24px;
    }
    .reloj-logo {
      height: 120px;
      width: auto;
      filter: brightness(0) invert(1);
    }
    .reloj-clock { font-size: clamp(56px, 16vw, 120px); font-weight: 800; letter-spacing: 2px; line-height: 1; font-variant-numeric: tabular-nums; }
    .reloj-date { font-size: clamp(16px, 3.2vw, 24px); color: #9fb6cc; font-weight: 600; text-transform: capitalize; }
    .reloj-note { font-size: 14px; color: #7c93ab; text-align: center; min-height: 20px; }
    .reloj-note a { color: #14b8a6; }

    .reloj-mode-switch {
      display: flex;
      gap: 28px;
      justify-content: center;
      margin-top: 12px;
    }
    .reloj-mode-button {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      color: #f8fafc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .reloj-mode-button svg { width: 64px; height: 64px; }
    .reloj-mode-button.active,
    .reloj-mode-button:hover {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.16);
      color: #d9f99d;
    }
    .reloj-fingerprint {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      pointer-events: none;
      z-index: 2;
    }
    .reloj-fingerprint.show {
      display: flex;
      pointer-events: auto;
    }
    .reloj-fingerprint-icon {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.14);
      border: 2px solid rgba(34, 197, 94, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      color: #22c55e;
      box-shadow: 0 0 40px rgba(34, 197, 94, 0.16);
    }
    .reloj-fingerprint-text {
      color: #dbeafe;
      font-size: clamp(16px, 3vw, 20px);
      text-align: center;
      max-width: 380px;
      line-height: 1.4;
    }
    .reloj-fingerprint-btn {
      padding: 14px 28px;
      border: none;
      border-radius: 999px;
      background: #16a34a;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(22, 163, 74, 0.24);
    }
    .reloj-fingerprint-btn:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .reloj-scan {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .reloj-scan.show { display: flex; }
    .reloj-scan video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .reloj-scan canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }
    .reloj-challenge {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.78);
      color: #fde047;
      font-weight: 800;
      font-size: clamp(18px, 4vw, 30px);
      letter-spacing: 1px;
      padding: 14px 30px;
      border-radius: 999px;
      text-align: center;
      white-space: nowrap;
      max-width: 94%;
    }
    .reloj-scan-status {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #dbeafe;
      font-size: clamp(14px, 3vw, 20px);
      font-weight: 600;
      padding: 10px 22px;
      border-radius: 999px;
      text-align: center;
      max-width: 94%;
    }
    .reloj-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.6);
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reloj-msg {
      position: fixed;
      inset: 0;
      background: #fff;
      color: #0f172a;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      text-align: center;
      padding: 30px;
      z-index: 50;
    }
    .reloj-msg.show { display: flex; }
    .reloj-msg img { height: 110px; width: auto; filter: brightness(0) invert(1); }
    .reloj-msg-text { font-size: clamp(34px, 8vw, 64px); font-weight: 800; line-height: 1.15; }
    .reloj-msg.entrada .reloj-msg-text { color: #0d9488; }
    .reloj-msg.salida .reloj-msg-text { color: #2563eb; }
    .reloj-msg-sub { font-size: clamp(16px, 3.5vw, 26px); color: #64748b; font-weight: 600; }
  </style>
</head>
<body>
  <div class="reloj-home" id="relojHome">
    <img class="reloj-logo" src="icons/braindev_logo.svg" alt="FIAT">
    <div class="reloj-clock" id="relojClock">--:--:--</div>
    <div class="reloj-date" id="relojDate"></div>
    <div class="reloj-note" id="relojNote"></div>
    <div class="reloj-mode-switch">
      <button class="reloj-mode-button active" id="relojModeFace" title="Rostro" aria-label="Escaneo facial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="11" r="3"/><path d="M7.5 16.5c.9 1.3 2.7 2 4.5 2s3.6-.7 4.5-2"/></svg>
      </button>
      <button class="reloj-mode-button" id="relojModeFinger" title="Huella" aria-label="Huella dactilar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
      </button>
    </div>
  </div>

  <div class="reloj-scan" id="relojScan">
    <video id="relojVideo" autoplay muted playsinline></video>
    <canvas id="relojOverlay"></canvas>
    <div class="reloj-fingerprint" id="relojFingerprint">
      <div class="reloj-fingerprint-icon">🔐</div>
      <div class="reloj-fingerprint-text" id="relojFingerprintText">Selecciona el modo Huella y presiona el botón para abrir el lector biométrico del teléfono.</div>
      <button class="reloj-fingerprint-btn" id="relojFingerprintBtn">Usar lector del teléfono</button>
    </div>
    <div class="reloj-scan-status" id="relojScanStatus">Iniciando cámara...</div>
    <div class="reloj-challenge" id="relojChallenge" style="display:none;"></div>
    <button class="reloj-close" id="relojClose">✕</button>
  </div>

  <div class="reloj-msg" id="relojMsg">
    <img src="icons/braindev_logo.svg" alt="FIAT">
    <div class="reloj-msg-text" id="relojMsgText"></div>
    <div class="reloj-msg-sub" id="relojMsgSub"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    (function () {
      'use strict';

      var MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
      var DIST = 0.55;

      var st = {
        video: null,
        stream: null,
        timer: null,
        ticking: false,
        models: null,
        state: 'idle',
        mode: 'face',
        fingerprintPending: false,
        profile: null,
        streak: 0,
        lastId: null,
        challenge: null,
        chal: null,
        profiles: [],
        names: {},
        marcajes: []
      };

      var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
      var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

      function $(id) { return document.getElementById(id); }

      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function nameOf(id) {
        var t = st.names[id];
        return t ? ((t.nombres || '') + ' ' + (t.apellidos || '')).trim() : 'Trabajador';
      }

      function localDateStr(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }
      function todayISO() { return localDateStr(new Date().toISOString()); }

      function tickClock() {
        var d = new Date();
        var hh = String(d.getHours()).padStart(2, '0');
        var mm = String(d.getMinutes()).padStart(2, '0');
        var ss = String(d.getSeconds()).padStart(2, '0');
        $('relojClock').textContent = hh + ':' + mm + ':' + ss;
        $('relojDate').textContent = DIAS[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();
      }

      function loadModels() {
        if (!st.models) {
          st.models = Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
            faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
            faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
            faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
          ]);
        }
        return st.models;
      }

      async function loadDatos() {
        var pl = await supabaseClient.from('plantilla_trabajadores').select('id, nombres, apellidos, cedula').eq('estado', 'Activo');
        if (!pl.error) {
          st.names = {};
          (pl.data || []).forEach(function (t) { st.names[t.id] = t; });
        }
        var pRes = await supabaseClient.from('comp_biometria_perfiles').select('*').eq('activo', true);
        var mRes = await supabaseClient.from('comp_marcajes').select('*').order('fecha_hora', { ascending: false }).limit(300);
        st.profiles = (pRes.data || []).filter(function (p) { return st.names[p.trabajador_id]; });
        st.marcajes = mRes.data || [];
      }

      async function startScan() {
        if (st.state === 'scanning' || st.state === 'challenge' || st.state === 'success') return;
        if (st.mode === 'face') {
          if (!st.stream) {
            try {
              st.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
              st.video.srcObject = st.stream;
              await st.video.play();
            } catch (e) {
              setStatus('No se pudo acceder a la cámara. Permite el acceso e inténtalo de nuevo.', 'err');
              return;
            }
          }
          st.state = 'scanning';
          setStatus('Mantén tu rostro frente a la cámara', 'info');
        } else {
          if (st.stream) {
            st.stream.getTracks().forEach(function (t) { t.stop(); });
            st.stream = null;
            st.video.srcObject = null;
          }
          st.state = 'fingerprint';
          setStatus('Huella seleccionada: coloca tu dedo en el lector y presiona verificar.', 'info');
        }
        $('relojHome').style.display = 'none';
        $('relojScan').classList.add('show');
        setChallenge('');
        updateScanUI();
        if (!st.timer) st.timer = setInterval(tick, 180);
      }

      function stopScan() {
        if (st.timer) { clearInterval(st.timer); st.timer = null; }
        if (st.stream) { st.stream.getTracks().forEach(function (t) { t.stop(); }); st.stream = null; }
        if (st.video) st.video.srcObject = null;
        st.state = 'idle';
        st.profile = null; st.streak = 0; st.lastId = null;
        setChallenge('');
        $('relojScan').classList.remove('show');
        $('relojHome').style.display = '';
      }

      function setScanMode(mode) {
        st.mode = mode;
        $('relojModeFace').classList.toggle('active', mode === 'face');
        $('relojModeFinger').classList.toggle('active', mode === 'fingerprint');
        updateScanUI();
        if (mode === 'face') {
          setStatus('Escaneo facial iniciado. Mantén tu rostro frente a la cámara.', 'info');
        } else {
          setStatus('Modo Huella seleccionado. Pulsa Verificar para usar el lector del dispositivo.', 'info');
        }
      }

      function updateScanUI() {
        var video = $('relojVideo');
        var fingerprint = $('relojFingerprint');
        if (st.mode === 'face') {
          video.style.display = 'block';
          fingerprint.classList.remove('show');
        } else {
          video.style.display = 'none';
          fingerprint.classList.add('show');
        }
      }

      async function verifyFingerprint() {
        if (st.mode !== 'fingerprint' || st.fingerprintPending) return;
        st.fingerprintPending = true;
        $('relojFingerprintBtn').disabled = true;
        setStatus('Abriendo el lector biométrico del teléfono...', 'ok');
        $('relojFingerprintText').textContent = 'Espera a que el sistema te solicite usar tu huella o Face ID/biometría del dispositivo.';
        try {
          if (!window.isSecureContext || !window.PublicKeyCredential || typeof window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable !== 'function') {
            throw new Error('Este navegador no admite autenticación biométrica en este contexto.');
          }

          var available = await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
          if (!available) {
            throw new Error('El dispositivo no tiene un autenticador biométrico disponible.');
          }

          var challenge = new Uint8Array(32);
          crypto.getRandomValues(challenge);
          var publicKey = {
            challenge: challenge,
            rpId: window.location.hostname,
            allowCredentials: [],
            userVerification: 'required',
            timeout: 60000
          };

          var cred = await navigator.credentials.get({ publicKey: publicKey });
          if (!cred) {
            throw new Error('No se completó la autenticación biométrica.');
          }

          setStatus('Huella verificada con éxito desde el teléfono.', 'ok');
          $('relojFingerprintText').textContent = 'La verificación biométrica quedó completa. Ya puedes continuar con el marcaje.';
        } catch (err) {
          var msg = 'No fue posible abrir el lector del teléfono. Revisa permisos, HTTPS o compatibilidad del navegador.';
          if (err && err.message) {
            msg = err.message;
          }
          setStatus(msg, 'warn');
          $('relojFingerprintText').textContent = 'Si el lector no aparece, usa un navegador compatible con WebAuthn en HTTPS o localhost.';
        } finally {
          st.fingerprintPending = false;
          $('relojFingerprintBtn').disabled = false;
        }
      }

      async function tick() {
        if (st.ticking || st.state === 'success') return;
        if (st.mode === 'fingerprint') {
          drawOverlay(null);
          return;
        }
        if (!st.video || st.video.readyState < 2) return;
        st.ticking = true;
        try {
          var dets = await faceapi.detectAllFaces(st.video, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.45 }))
            .withFaceLandmarks().withFaceDescriptors().withFaceExpressions();
          if (st.state === 'scanning') processDetect(dets);
          else if (st.state === 'challenge') processChallenge(dets);
          drawOverlay(dets[0]);
        } catch (e) {
          drawOverlay(null);
        }
        st.ticking = false;
      }

      function matchFace(desc) {
        var best = null;
        for (var i = 0; i < st.profiles.length; i++) {
          var list = st.profiles[i].descriptor;
          if (!Array.isArray(list) || !list.length) continue;
          if (typeof list[0] === 'number') list = [list];
          var min = Infinity;
          for (var j = 0; j < list.length; j++) {
            var d = faceapi.euclideanDistance(desc, Float32Array.from(list[j]));
            if (d < min) min = d;
          }
          if (!best || min < best.d) best = { p: st.profiles[i], d: min };
        }
        return best && best.d <= DIST ? best : null;
      }

      function processDetect(dets) {
        if (!dets.length) { st.streak = 0; st.lastId = null; setStatus('Mantén tu rostro frente a la cámara', 'info'); return; }
        if (dets.length > 1) { st.streak = 0; st.lastId = null; setStatus('Solo puede marcarse una persona a la vez', 'warn'); return; }
        var m = matchFace(dets[0].descriptor);
        if (!m) { st.streak = 0; st.lastId = null; setStatus('Rostro no registrado. Pide al administrador el enrolamiento.', 'warn'); return; }
        if (st.lastId === m.p.trabajador_id) st.streak += 1; else { st.streak = 1; st.lastId = m.p.trabajador_id; }
        setStatus(nameOf(m.p.trabajador_id) + ' · confianza ' + Math.max(0, Math.min(100, Math.round((1 - m.d) * 100))) + '%', 'ok');
        if (st.streak >= 5) startChallenge(m.p);
      }

      var CHALLENGES = [
        { label: 'PARPADEA', check: checkBlink },
        { label: 'GIRA LA CABEZA A LA IZQUIERDA', check: checkLeft },
        { label: 'GIRA LA CABEZA A LA DERECHA', check: checkRight },
        { label: 'SONRÍE', check: checkSmile }
      ];

      function startChallenge(profile) {
        st.profile = profile;
        st.challenge = CHALLENGES[Math.floor(Math.random() * CHALLENGES.length)];
        st.chal = { blinks: 0, wasClosed: false, sustained: 0 };
        st.state = 'challenge';
        setStatus('Verificación de vida · ' + nameOf(profile.trabajador_id), 'ok');
        setChallenge(st.challenge.label);
      }

      function dist2(p1, p2) { return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2)); }
      function ear(lm) {
        var l = (dist2(lm[37], lm[41]) + dist2(lm[38], lm[40])) / (2 * dist2(lm[36], lm[39]) || 1);
        var r = (dist2(lm[43], lm[47]) + dist2(lm[44], lm[46])) / (2 * dist2(lm[42], lm[45]) || 1);
        return (l + r) / 2;
      }
      function yaw(lm) {
        var l = lm[1], r = lm[15], nose = lm[30];
        var cx = (l.x + r.x) / 2;
        var fw = Math.max(dist2(l, r), 1);
        return (nose.x - cx) / fw;
      }
      function sustain(cond, n) {
        if (cond) st.chal.sustained += 1; else st.chal.sustained = 0;
        return st.chal.sustained >= n;
      }
      function checkBlink(lm) {
        var open = ear(lm) >= 0.22;
        if (!open) st.chal.wasClosed = true;
        else if (st.chal.wasClosed) { st.chal.blinks += 1; st.chal.wasClosed = false; }
        return st.chal.blinks >= 1;
      }
      function checkLeft(lm) { return sustain(yaw(lm) > 0.15, 4); }
      function checkRight(lm) { return sustain(yaw(lm) < -0.15, 4); }
      function checkSmile(lm, det) {
        if (!det || !det.expressions) return false;
        return sustain(det.expressions.smiling > 0.5, 4);
      }

      function processChallenge(dets) {
        if (!dets.length || dets.length > 1) { st.chal.sustained = 0; setStatus('Mantén tu rostro frente a la cámara', 'warn'); return; }
        var m = matchFace(dets[0].descriptor);
        if (!m || m.p.trabajador_id !== st.profile.trabajador_id) {
          st.chal.sustained = 0;
          setStatus('Rostro no verificado. Inténtalo de nuevo.', 'warn');
          return;
        }
        if (st.challenge.check(dets[0].landmarks.positions, dets[0])) chalOk();
      }

      async function chalOk() {
        st.state = 'success';
        setChallenge('');
        setStatus('Verificado. Registrando...', 'ok');
        try {
          var hoy = todayISO();
          var lista = st.marcajes.filter(function (m) { return m.trabajador_id === st.profile.trabajador_id && localDateStr(m.fecha_hora) === hoy; });
          var tipo = lista.length % 2 === 0 ? 'Entrada' : 'Salida';
          var ins = await supabaseClient.from('comp_marcajes').insert([{ trabajador_id: st.profile.trabajador_id, tipo: tipo, fecha_hora: new Date().toISOString(), fuente: 'biometria' }]);
          if (ins.error) throw ins.error;
          await loadDatos();
          showGreeting(nameOf(st.profile.trabajador_id), tipo);
        } catch (err) {
          setStatus('Error al guardar el marcaje: ' + (err.message || 'error'), 'err');
          setTimeout(function () { stopScan(); }, 3000);
        }
      }

      function showGreeting(nombre, tipo) {
        var msg = $('relojMsg');
        $('relojMsgText').textContent = (tipo === 'Entrada' ? '¡Bienvenido, ' : '¡Hasta luego, ') + nombre + '!';
        $('relojMsgSub').textContent = tipo === 'Entrada' ? 'Que tengas un excelente día' : 'Nos vemos pronto';
        msg.className = 'reloj-msg show ' + (tipo === 'Entrada' ? 'entrada' : 'salida');
        setTimeout(function () {
          msg.classList.remove('show');
          msg.className = 'reloj-msg';
          stopScan();
        }, 4000);
      }

      function drawOverlay(d) {
        var cv = $('relojOverlay');
        if (!cv) return;
        var ctx = cv.getContext('2d');
        if (cv.width !== st.video.videoWidth || cv.height !== st.video.videoHeight) {
          cv.width = st.video.videoWidth;
          cv.height = st.video.videoHeight;
        }
        ctx.clearRect(0, 0, cv.width, cv.height);

        var cx = cv.width / 2;
        var cy = cv.height / 2;
        var radius = Math.min(cv.width, cv.height) * 0.28;

        // Fondo semi-transparente fuera del círculo
        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Cuadrícula transparente sobre toda la pantalla
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
        ctx.lineWidth = 1;
        var spacing = Math.max(18, Math.round(Math.min(cv.width, cv.height) / 24));
        for (var x = 0; x <= cv.width; x += spacing) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, cv.height);
          ctx.stroke();
        }
        for (var y = 0; y <= cv.height; y += spacing) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(cv.width, y);
          ctx.stroke();
        }
        ctx.restore();

        // Círculo guía para el rostro
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#22c55e';
        ctx.shadowColor = 'rgba(34, 197, 94, 0.45)';
        ctx.shadowBlur = 18;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Texto guía dentro del círculo
        ctx.font = '700 ' + Math.round(radius * 0.16) + 'px Inter, system-ui, sans-serif';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Coloca tu rostro aquí', cx, cy);

        // Indicadores en los bordes del círculo
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 4;
        var len = radius * 0.18;
        ctx.beginPath();
        ctx.moveTo(cx - radius, cy);
        ctx.lineTo(cx - radius + len, cy);
        ctx.moveTo(cx + radius, cy);
        ctx.lineTo(cx + radius - len, cy);
        ctx.moveTo(cx, cy - radius);
        ctx.lineTo(cx, cy - radius + len);
        ctx.moveTo(cx, cy + radius);
        ctx.lineTo(cx, cy + radius - len);
        ctx.stroke();

        if (!d) return;

        var box = d.detection.box;
        ctx.strokeStyle = st.state === 'challenge' ? '#f59e0b' : '#10b981';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 10]);
        ctx.strokeRect(box.x, box.y, box.width, box.height);
        ctx.setLineDash([]);
        if (d.landmarks) {
          ctx.fillStyle = '#22c55e';
          d.landmarks.positions.forEach(function (p) { ctx.fillRect(p.x - 1, p.y - 1, 4, 4); });
        }
      }

      function setStatus(text, type) {
        var el = $('relojScanStatus');
        el.textContent = text;
        el.style.color = type === 'err' ? '#f87171' : type === 'warn' ? '#fbbf24' : type === 'ok' ? '#4ade80' : '#dbeafe';
      }
      function setChallenge(text) {
        var el = $('relojChallenge');
        el.style.display = text ? 'block' : 'none';
        el.textContent = text;
      }

      $('relojModeFace').addEventListener('click', function () { setScanMode('face'); startScan(); });
      $('relojModeFinger').addEventListener('click', function () { setScanMode('fingerprint'); startScan(); });
      $('relojFingerprintBtn').addEventListener('click', verifyFingerprint);
      $('relojClose').addEventListener('click', function () { stopScan(); });

      document.addEventListener('DOMContentLoaded', function () {
        st.video = $('relojVideo');
        tickClock();
        setInterval(tickClock, 1000);

        supabaseClient.auth.getSession().then(function (s) {
          if (!(s && s.data && s.data.session)) {
            $('relojNote').innerHTML = 'Sesión no activa en este dispositivo. <a href="index.html">Inicia sesión una vez</a> para habilitar el reloj.';
            return;
          }
          loadDatos().catch(function () {});
          loadModels().catch(function () {});
        });
      });
    })();
  </script>
</body>
</html>
